<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nightwatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#0a0a0a;
  --plane:#0f0f0e;
  --card:#141413;
  --card-2:#1a1a19;
  --line:rgba(255,255,255,.09);
  --line-strong:rgba(255,255,255,.16);
  --ink:#ffffff;
  --ink-2:#a8a79e;
  --ink-3:#6e6d68;
  --accent:#cef24e;
  --accent-ink:#0a0a0a;
  --accent-wash:rgba(206,242,78,.10);
  --accent-edge:rgba(206,242,78,.32);
  --warn:#fab219;
  --warn-wash:rgba(250,178,25,.10);
  --bad:#e5484d;
  --bad-wash:rgba(229,72,77,.10);
  --unknown:#6e6d68;
  --ui:"Archivo",-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:12px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--ui);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:264px 1fr;min-height:100%}
.side{
  background:var(--plane);border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:4px;padding:20px 16px;
  position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand-mark{width:26px;height:26px;flex:none}
.brand-name{font-weight:700;font-size:17px;letter-spacing:-.02em}
.nav-group{margin-top:14px}
.nav-label{
  font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);padding:0 8px 8px;font-weight:600;
}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:9px 10px;border-radius:8px;color:var(--ink-2);
  font-weight:500;text-align:left;transition:background .12s,color .12s;
}
.nav-item:hover{background:rgba(255,255,255,.04);color:var(--ink)}
.nav-item[aria-current="page"]{background:var(--card-2);color:var(--ink)}
.nav-item svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6}
.nav-count{
  margin-left:auto;font-family:var(--mono);font-size:11px;
  background:rgba(255,255,255,.07);color:var(--ink-2);
  padding:1px 7px;border-radius:99px;
}
.nav-count.flag{background:var(--warn-wash);color:var(--warn)}
.side-foot{margin-top:auto;padding:16px 8px 0;border-top:1px solid var(--line);color:var(--ink-3);font-size:11.5px}

.main{min-width:0;padding:28px 32px 64px}
.page-head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-start;margin-bottom:22px}
h1{font-size:34px;line-height:1.1;letter-spacing:-.03em;margin:0;font-weight:700;text-wrap:balance}
.sub{color:var(--ink-2);margin:6px 0 0;font-size:13.5px}
.head-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* ---------- phase control ---------- */
.phases{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--plane);flex-wrap:wrap}
.phase{padding:9px 18px;color:var(--ink-2);font-weight:500;border-right:1px solid var(--line);white-space:nowrap}
.phase:last-child{border-right:none}
.phase[aria-pressed="true"]{background:var(--card-2);color:var(--ink)}
.phase:hover{color:var(--ink)}

/* ---------- primitives ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card.lift{background:var(--accent-wash);border-color:var(--accent-edge)}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-title{font-weight:600;font-size:15px}
.card.lift .card-title{color:var(--accent)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.section{margin-top:28px}
.section-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
h2{font-size:19px;letter-spacing:-.02em;margin:0;font-weight:600}
h3{font-size:14px;margin:0 0 10px;font-weight:600;letter-spacing:-.01em}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.big{font-family:var(--mono);font-size:40px;line-height:1;letter-spacing:-.03em;font-weight:500}
.card.lift .big{color:var(--accent)}
.muted{color:var(--ink-2)}
.dim{color:var(--ink-3)}
p{margin:0 0 10px}
p:last-child{margin-bottom:0}

.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:600;
  border:1px solid var(--line-strong);color:var(--ink-2);white-space:nowrap;
}
.chip.good{background:var(--accent-wash);border-color:var(--accent-edge);color:var(--accent)}
.chip.warn{background:var(--warn-wash);border-color:rgba(250,178,25,.32);color:var(--warn)}
.chip.bad{background:var(--bad-wash);border-color:rgba(229,72,77,.32);color:var(--bad)}
.chip.unk{background:rgba(255,255,255,.04);color:var(--ink-3)}
.glyph{font-family:var(--mono);font-weight:700}

.kv{display:grid;grid-template-columns:1fr auto;gap:7px 16px;align-items:baseline}
.kv dt{color:var(--ink-2);font-size:13px;min-width:0}
.kv dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;text-align:right}

.rule{height:1px;background:var(--line);border:0;margin:16px 0}

/* ---------- table ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:660px}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
tbody tr:last-child td{border-bottom:none}
tbody tr.row-btn{cursor:pointer}
tbody tr.row-btn:hover{background:rgba(255,255,255,.03)}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
.rank{font-family:var(--mono);color:var(--ink-3)}

/* ---------- score bars ---------- */
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(120px,1.1fr) minmax(0,2.4fr) 62px;gap:12px;align-items:center}
.bar-name{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px;min-width:0}
.bar-name span{overflow:hidden;text-overflow:ellipsis}
.bar-track{height:9px;border-radius:99px;background:rgba(255,255,255,.06);position:relative;overflow:hidden}
.bar-fill{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--accent)}
.bar-fill.unk{
  background:repeating-linear-gradient(135deg,var(--unknown) 0 5px,rgba(110,109,104,.35) 5px 10px);
}
.bar-val{font-family:var(--mono);font-size:12px;text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}
.bar-val.unk{color:var(--ink-3)}

/* ---------- sector diverging ---------- */
.sect{display:flex;flex-direction:column;gap:9px}
.sect-row{display:grid;grid-template-columns:minmax(96px,1fr) minmax(0,2fr) 54px;gap:12px;align-items:center}
.sect-axis{position:relative;height:18px}
.sect-zero{position:absolute;top:-2px;bottom:-2px;left:50%;width:1px;background:var(--line-strong)}
.sect-bar{position:absolute;top:4px;height:10px;border-radius:2px}
.sect-bar.pos{background:var(--accent);left:50%}
.sect-bar.neg{background:var(--bad);right:50%}
.sect-bar.unq{background:repeating-linear-gradient(135deg,rgba(229,72,77,.85) 0 5px,rgba(229,72,77,.35) 5px 10px);right:50%}

/* ---------- checklist ---------- */
.checks{display:flex;flex-direction:column;gap:2px}
.check{
  display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;
  padding:10px 4px;border-bottom:1px solid var(--line);
}
.check:last-child{border-bottom:none}
.check-mark{font-family:var(--mono);font-weight:700;font-size:14px;line-height:1.45;text-align:center}
.m-ok{color:var(--accent)}
.m-no{color:var(--bad)}
.m-unk{color:var(--ink-3)}
.check-text{font-size:13.5px;min-width:0}
.check-text .why{display:block;color:var(--ink-3);font-size:11.5px;margin-top:2px}
.check.met .check-text{color:var(--ink)}
.check.unmet .check-text{color:var(--ink-2)}
.check.pend .check-text{color:var(--ink-2)}
.tally{
  display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:14px;
  border-top:1px solid var(--line);font-size:13px;
}
.tally .num{font-size:15px}

/* ---------- ladder ---------- */
.ladder{position:relative;height:306px;margin:2px 0 4px;overflow:hidden}
.lad-band{position:absolute;left:0;width:46px;border-radius:3px}
.lad-band.risk{background:rgba(229,72,77,.20)}
.lad-band.r1{background:rgba(206,242,78,.15)}
.lad-band.r2{background:rgba(206,242,78,.07)}
.lad-entry{position:absolute;left:0;width:46px;background:var(--accent);opacity:.7;border-radius:3px}
.lad-tick{position:absolute;left:0;width:56px;height:0;border-top:1.5px solid var(--line-strong)}
.lad-tick.acc{border-top-color:var(--accent)}
.lad-tick.bad{border-top-color:var(--bad)}
.lad-tick.ink{border-top-color:var(--ink-2)}
.lad-tick.dash{border-top-style:dashed}
.lad-lab{
  position:absolute;left:64px;right:0;transform:translateY(-50%);
  display:flex;gap:8px;align-items:baseline;font-size:11.5px;white-space:nowrap;
}
.lad-lab .role{font-size:10px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--ink-3)}
.lad-lab.acc .role{color:var(--accent)}
.lad-lab.bad .role{color:var(--bad)}
.lad-lab .px{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.lad-lab.ink .px{color:var(--ink-2)}
.lad-lab .note{color:var(--ink-3);font-size:10.5px}

/* ---------- banner ---------- */
.banner{
  display:flex;gap:12px;align-items:flex-start;padding:13px 16px;border-radius:10px;
  border:1px solid var(--line-strong);background:var(--card-2);font-size:13px;
}
.banner.warn{background:var(--warn-wash);border-color:rgba(250,178,25,.3)}
.banner.bad{background:var(--bad-wash);border-color:rgba(229,72,77,.3)}
.banner.good{background:var(--accent-wash);border-color:var(--accent-edge)}
.banner .glyph{flex:none;font-size:14px;line-height:1.5}
.banner > div{min-width:0}
.banner .num{overflow-wrap:anywhere;word-break:break-word}

/* ---------- light ---------- */
.lights{display:flex;gap:10px;flex-wrap:wrap}
.light{
  flex:1 1 150px;border:1px solid var(--line);border-radius:10px;padding:13px 14px;
  background:var(--card-2);opacity:.42;transition:opacity .15s;
}
.light.on{opacity:1}
.light.on.green{border-color:var(--accent-edge);background:var(--accent-wash)}
.light.on.yellow{border-color:rgba(250,178,25,.35);background:var(--warn-wash)}
.light.on.red{border-color:rgba(229,72,77,.35);background:var(--bad-wash)}
.light-name{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;margin-bottom:4px}
.light.green .light-name{color:var(--accent)}
.light.yellow .light-name{color:var(--warn)}
.light.red .light-name{color:var(--bad)}
.light-body{font-size:12px;color:var(--ink-2)}

/* ---------- inputs ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.input{
  background:var(--card-2);border:1px solid var(--line-strong);border-radius:8px;
  padding:10px 12px;color:var(--ink);font-family:var(--mono);font-size:14px;width:100%;
}
.input:focus{border-color:var(--accent);outline:none}
.switch{display:inline-flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.switch input{position:absolute;opacity:0;width:0;height:0}
.track{width:34px;height:19px;border-radius:99px;background:rgba(255,255,255,.12);position:relative;transition:background .15s;flex:none}
.track::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--ink-2);transition:transform .15s,background .15s}
.switch input:checked + .track{background:var(--accent)}
.switch input:checked + .track::after{transform:translateX(15px);background:var(--accent-ink)}
.switch input:focus-visible + .track{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- toolbar / api ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.btn{
  display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:9px;
  border:1px solid var(--line-strong);background:var(--card-2);color:var(--ink);
  font-weight:600;font-size:13px;white-space:nowrap;
}
.btn:hover{background:rgba(255,255,255,.06)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.spin{
  width:13px;height:13px;border:2px solid rgba(10,10,10,.28);
  border-top-color:var(--accent-ink);border-radius:50%;animation:sp .7s linear infinite;flex:none;
}
@keyframes sp{to{transform:rotate(360deg)}}
.api-url{width:210px;padding:8px 11px;font-size:12.5px}
.src-toggle{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.src-toggle button{padding:8px 14px;color:var(--ink-2);font-weight:500;font-size:13px;border-right:1px solid var(--line)}
.src-toggle button:last-child{border-right:none}
.src-toggle button[aria-pressed="true"]{background:var(--card-2);color:var(--ink)}

td.wrap{white-space:normal;min-width:210px;max-width:290px;font-size:12.5px}
.cond-mini{display:flex;flex-direction:column;gap:4px}
.cond-mini > span{display:grid;grid-template-columns:30px 1fr;gap:6px;align-items:baseline}
.cond-mini .rq{font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;color:var(--ink-3);text-transform:uppercase}
.cond-mini .rq.req{color:var(--accent)}
.flagcell{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.tgt-stack{display:flex;flex-direction:column;gap:3px;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px}
.tgt-stack .p{color:var(--accent)}

/* ---------- logs ---------- */
.logrow{
  display:grid;grid-template-columns:78px 62px 132px 1fr;gap:10px;
  padding:7px 4px;border-bottom:1px solid var(--line);font-size:12px;align-items:baseline;
}
.logrow:last-child{border-bottom:none}
.logrow .t{font-family:var(--mono);color:var(--ink-3);font-size:11px}
.logrow .lv{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.lv.info{color:var(--ink-3)} .lv.ok{color:var(--accent)} .lv.warn{color:var(--warn)} .lv.error{color:var(--bad)}
.logrow .ev{font-weight:600;color:var(--ink-2)}
.logrow .dt{font-family:var(--mono);font-size:11px;color:var(--ink-3);white-space:pre-wrap;word-break:break-word;min-width:0}
.logwrap{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:6px 14px}
.conn-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.step{display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:start;margin-bottom:18px}
.step-n{
  width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--mono);font-size:12px;font-weight:700;
  background:var(--card-2);color:var(--ink-2);border:1px solid var(--line-strong);
}
.step.done .step-n{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.step-body{min-width:0}
.step h3{margin-bottom:6px}
textarea.input{
  width:100%;min-height:160px;resize:vertical;font-family:var(--mono);
  font-size:12px;line-height:1.5;white-space:pre;overflow-x:auto;
}
.brief-box{
  max-height:220px;overflow:auto;background:var(--card-2);border:1px solid var(--line);
  border-radius:8px;padding:12px;font-family:var(--mono);font-size:11.5px;
  white-space:pre-wrap;word-break:break-word;color:var(--ink-2);
}

.list{margin:0;padding-left:18px;color:var(--ink-2);font-size:13.5px}
.list li{margin-bottom:6px}
.list li:last-child{margin-bottom:0}
.list.tight li{margin-bottom:4px}

.fip{display:grid;gap:10px}
.fip > div{padding-left:12px;border-left:2px solid var(--line-strong)}
.fip .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--ink-3);display:block;margin-bottom:3px}
.fip .fact{border-left-color:var(--accent-edge)}
.fip .fact .lab{color:var(--accent)}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;gap:6px;overflow-x:auto;padding:12px 16px;border-right:none;border-bottom:1px solid var(--line)}
  .brand{padding:0 12px 0 0;flex:none}
  .nav-group{margin-top:0;display:flex;align-items:center;gap:6px}
  .nav-label,.side-foot,.nav-count{display:none}
  .nav-item{width:auto;white-space:nowrap;padding:7px 11px}
  .main{padding:22px 16px 56px}
  h1{font-size:26px}
  .g2,.g3{grid-template-columns:1fr}
  .bar-row{grid-template-columns:minmax(96px,1fr) minmax(0,1.6fr) 54px;gap:8px}
  .big{font-size:32px}
}

/* ---- Plan view (live ChatGPT plan) ---- */
.pv-strip{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:12px;margin-bottom:18px}
.pv-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.pv-label{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.pv-card p{margin:0;color:var(--ink-2);font-size:13px;line-height:1.5}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clamp1{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.top3{display:flex;flex-direction:column;gap:4px;font-size:13px}
.top3 span{display:flex;gap:8px;align-items:baseline}
.top3 b{font-family:var(--mono);font-size:11px;color:var(--ink-3);font-weight:500;width:18px}
table.dense th,table.dense td{padding:9px 12px}
table.dense td.n,table.dense th.n{text-align:right}
.sub-n{display:block;font-size:11px;color:var(--ink-3);font-family:var(--mono)}
tr.pv-row{cursor:pointer}
tr.pv-row:hover td{background:var(--card-2)}
tr.pv-row.open td{background:var(--card-2);border-bottom-color:transparent}
tr.pv-row .caret{color:var(--ink-3);transition:transform .15s;display:inline-block}
tr.pv-row.open .caret{transform:rotate(90deg)}
tr.pv-detail>td{background:var(--card-2);padding:2px 18px 20px;white-space:normal}
.pv-grid{display:grid;grid-template-columns:1.25fr 1.2fr .9fr;gap:22px}
.pv-sec h4{margin:14px 0 6px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.pv-sec p{margin:0;color:var(--ink-2);font-size:13px;line-height:1.55}
.pv-warn{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.pv-warn div{background:var(--warn-wash);color:var(--warn);border-radius:8px;padding:7px 10px;font-size:12.5px;line-height:1.45}
.cl{display:grid;grid-template-columns:44px 1fr;gap:5px 8px;font-size:13px}
.cl .rq{font-family:var(--mono);font-size:10px;padding-top:2px;color:var(--ink-3)}
.cl .rq.req{color:var(--accent)}
.gp{display:grid;grid-template-columns:minmax(110px,.8fr) 1.2fr;gap:5px 12px;font-size:12.5px}
.gp dt{color:var(--ink-3)} .gp dd{margin:0;color:var(--ink-2)}
.lv{display:grid;grid-template-columns:auto 1fr auto;gap:5px 12px;font-family:var(--mono);font-size:13px;align-items:baseline}
.lv .k{font-family:var(--ui);font-size:12px;color:var(--ink-3)}
.lv .v{text-align:right}
.lv .d{font-size:11px;color:var(--ink-3);text-align:right}
.pv-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pv-cols ul{margin:0;padding-left:16px;color:var(--ink-2);font-size:13px;line-height:1.5}
.pv-cols li+li{margin-top:5px}
tr.wl-row{cursor:pointer}
tr.wl-row.open .clamp1{-webkit-line-clamp:unset}
@media (max-width:1000px){.pv-strip{grid-template-columns:1fr 1fr}.pv-grid,.pv-cols{grid-template-columns:1fr}}
@media (max-width:560px){.pv-strip{grid-template-columns:1fr}}

.hist-bar{display:flex;gap:6px;align-items:stretch;overflow-x:auto;margin-bottom:16px;padding-bottom:2px}
.hist-tab{display:flex;flex-direction:column;align-items:flex-start;gap:1px;flex:none;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 12px;color:var(--ink-2);font:inherit;font-size:13px;cursor:pointer;text-align:left}
.hist-tab:hover{border-color:var(--line-strong);color:var(--ink)}
.hist-tab[aria-pressed="true"]{border-color:var(--accent-edge);background:var(--accent-wash);color:var(--ink)}
.hist-meta{font-size:11px;color:var(--ink-3);font-family:var(--mono)}
.hist-older{flex:none;width:auto;min-width:150px}

const fmt = (n, d=2) => n == null ? "—" : n.toLocaleString("en-IN",{minimumFractionDigits:d, maximumFractionDigits:d});

const pct = n => (n > 0 ? "+" : "") + n.toFixed(2) + "%";
const mid = r => Array.isArray(r) ? (r[0] + r[1]) / 2 : r;

function derive(s){
  const entryMid = mid(s.entry);
  const risk = entryMid - s.stop;
  const computed = s.score.reduce((a,f) => a + f.weighted, 0);
  const assessableMax = s.score.filter(f => f.verified).reduce((a,f) => a + f.max, 0);
  const assessableGot = s.score.filter(f => f.verified).reduce((a,f) => a + f.weighted, 0);
  const unknownPts = s.score.filter(f => !f.verified).reduce((a,f) => a + f.max, 0);
  const tgts = s.targets.map(t => {
    const tm = mid([t.lo, t.hi]);
    return { ...t, mid: tm, reward: tm - entryMid, rr: (tm - entryMid) / risk, profitPct: ((tm - entryMid) / entryMid) * 100 };
  });
  return { entryMid, risk, riskPct: (risk/entryMid)*100, computed, assessableMax, assessableGot,
           assessablePct: (assessableGot/assessableMax)*100, unknownPts,
           mismatch: Math.abs(computed - s.reportedScore) > 0.01, tgts };
}

/* =========================================================================
   LOG — a ring buffer of everything the app did, for debugging after the
   fact. Every request, response, error and auth event lands here. Secrets
   are masked before they are stored, so the log can be copied and shared.
   ========================================================================= */
const LOG = {
  entries: [],
  max: 500,
  seq: 0,
  add(level, event, detail){
    const e = {
      n: ++this.seq,
      at: new Date(),
      level,                    // info | ok | warn | error
      event,
      detail: LOG.redact(detail)
    };
    this.entries.push(e);
    if (this.entries.length > this.max) this.entries.shift();
    const badge = document.getElementById("nc-logs");
    if (badge){
      const errs = this.entries.filter(x => x.level === "error").length;
      badge.textContent = errs ? `${errs}!` : String(this.entries.length);
      badge.classList.toggle("flag", errs > 0);
    }
    return e;
  },
  /** Never store a token, session id or auth header in full. */
  redact(v){
    const SECRET = /^(accesstoken|access_token|token|sessionid|session|authorization|dhanclientid|partner_secret)$/i;
    const mask = s => {
      const str = String(s);
      return str.length <= 8 ? "***" : `${str.slice(0,4)}…${str.slice(-2)} (${str.length} chars)`;
    };
    const walk = (x, depth) => {
      if (x == null || depth > 6) return x;
      if (Array.isArray(x)) return x.slice(0, 40).map(i => walk(i, depth + 1));
      if (x instanceof Error) return { name:x.name, message:x.message, stack:(x.stack||"").split("\n").slice(0,4).join("\n") };
      if (typeof x === "object"){
        const out = {};
        for (const [k, val] of Object.entries(x)){
          out[k] = SECRET.test(k) && val ? mask(val) : walk(val, depth + 1);
        }
        return out;
      }
      return x;
    };
    try { return walk(v, 0); } catch(err){ return { unserializable:String(err) }; }
  },
  clear(){ this.entries = []; this.seq = 0; },
  asText(){
    return this.entries.map(e => {
      const d = e.detail === undefined ? "" : " " + JSON.stringify(e.detail);
      return `${e.at.toISOString()} [${e.level.toUpperCase()}] ${e.event}${d}`;
    }).join("\n");
  }
};
const log = (level, event, detail) => LOG.add(level, event, detail);

window.addEventListener("error", ev => {
  log("error", "window.error", { message: ev.message, source: ev.filename, line: ev.lineno, col: ev.colno });
});
window.addEventListener("unhandledrejection", ev => {
  log("error", "unhandledrejection", { reason: ev.reason instanceof Error ? ev.reason : String(ev.reason) });
});

/* =========================================================================
   API — one wrapper so every call is logged identically, carries the
   session when there is one, and fails with a message worth reading.
   ========================================================================= */
async function api(path, { method = "GET", body = null, auth = true } = {}){
  const url = `${state.apiBase}${path}`;
  const headers = {};
  if (body) headers["Content-Type"] = "application/json";
  if (auth && state.session) headers.Authorization = `Bearer ${state.session}`;

  const started = performance.now();
  log("info", `→ ${method} ${path}`, { url, hasSession: Boolean(state.session), body });

  let res;
  try {
    res = await fetch(url, { method, headers, body: body ? JSON.stringify(body) : undefined });
  } catch (err){
    const ms = Math.round(performance.now() - started);
    log("error", `✗ ${method} ${path}`, { ms, error: err, hint: "network failure — server down, wrong port, or blocked by the page's origin" });
    throw new Error(`Could not reach ${url}. Is the API running?`);
  }

  const ms = Math.round(performance.now() - started);
  let payload = null;
  const text = await res.text();
  try { payload = text ? JSON.parse(text) : null; } catch { payload = { raw: text.slice(0, 400) }; }

  if (!res.ok || (payload && payload.success === false)){
    const message = (payload && (payload.message || payload.error)) || `HTTP ${res.status} ${res.statusText}`;
    log("error", `✗ ${method} ${path}`, { status: res.status, ms, error: payload && payload.error, message, detail: payload && payload.detail });
    const err = new Error(message);
    err.status = res.status;
    err.code = payload && payload.error;
    err.detail = payload && payload.detail;
    throw err;
  }

  log("ok", `← ${method} ${path}`, { status: res.status, ms, bytes: text.length });
  return payload && payload.data !== undefined ? payload.data : payload;
}

/* ---------- auth ---------- */
function setSession(id){
  state.session = id || null;
  try { id ? localStorage.setItem("nw.session", id) : localStorage.removeItem("nw.session"); } catch(e){}
  log("info", id ? "session stored" : "session cleared", { sessionId: id });
}

async function refreshAuthStatus(){
  try {
    const data = await api("/auth/dhan/status");
    state.auth = { status: data.connected ? "connected" : "disconnected", data, busy:false, error:null };
    log(data.connected ? "ok" : "info", "auth status", data);
  } catch (err){
    state.auth = { status:"unreachable", data:null, busy:false, error: err.message };
    log("warn", "auth status unavailable", { error: err.message });
  }
  const badge = document.getElementById("nc-conn");
  if (badge){
    const on = state.auth.status === "connected";
    badge.textContent = on ? "on" : state.auth.status === "unreachable" ? "—" : "off";
    badge.classList.toggle("flag", !on);
  }
}

/** Opens Dhan's own login page in a popup and waits for the callback. */
async function loginWithDhan(){
  state.auth.busy = true; state.auth.error = null; render();
  try {
    const { loginUrl } = await api("/auth/dhan/login", { auth:false });
    log("info", "opening Dhan login popup", { loginUrl });

    const popup = window.open(loginUrl, "dhan-login", "width=480,height=720");
    if (!popup) throw new Error("The login popup was blocked. Allow popups for this page and try again.");

    const result = await new Promise((resolve, reject) => {
      const timer = setTimeout(() => { cleanup(); reject(new Error("Login timed out after 3 minutes.")); }, 180000);
      const closedPoll = setInterval(() => {
        if (popup.closed){ cleanup(); reject(new Error("The login window was closed before finishing.")); }
      }, 800);
      function onMessage(ev){
        if (ev.origin !== state.apiBase) return;   // only trust the API's own origin
        cleanup();
        resolve(ev.data);
      }
      function cleanup(){
        clearTimeout(timer); clearInterval(closedPoll);
        window.removeEventListener("message", onMessage);
      }
      window.addEventListener("message", onMessage);
    });

    log("info", "login callback received", result);
    if (!result || result.ok !== true) throw new Error((result && result.error) || "Dhan login failed.");
    setSession(result.sessionId);
    await refreshAuthStatus();
  } catch (err){
    state.auth.error = err.message;
    log("error", "Dhan login failed", { error: err.message });
  }
  state.auth.busy = false;
  render();
}

/** Fallback: the user pastes a token generated in Dhan's own console. */
async function loginWithToken(accessToken, dhanClientId){
  state.auth.busy = true; state.auth.error = null; render();
  try {

    setSession(data.sessionId);
    await refreshAuthStatus();
  } catch (err){
    state.auth.error = err.message;
    log("error", "token login failed", { error: err.message, code: err.code });
  }
  state.auth.busy = false;
  render();
}

async function disconnect(){
  try { await api("/auth/dhan/disconnect", { method:"POST" }); }

  setSession(null);
  await refreshAuthStatus();
  render();
}

function flagRow(r){
  const f = [];
  const long = r.bias === "LONG";
  if (r.entryVal != null && r.stop != null){
    if (long && r.stop >= r.entryVal) f.push("Stop is not below entry for a long");
    if (!long && r.stop <= r.entryVal) f.push("Stop is not above entry for a short");
  }
  r.targets.forEach(t => {
    if (t.val == null || r.entryVal == null) return;
    if (long && t.val <= r.entryVal) f.push(`${t.label} is not above entry`);
    if (!long && t.val >= r.entryVal) f.push(`${t.label} is not below entry`);
  });
  if (r.score != null && (r.score < 0 || r.score > 100)) f.push(`Score ${r.score} is outside 0–100`);
  if (r.breakdownSum != null && r.score != null && Math.abs(r.breakdownSum - r.score) > 0.01)
    f.push(`Factors sum to ${r.breakdownSum}, total says ${r.score}`);
  if (r.rrReported != null && r.rrComputed != null && Math.abs(r.rrReported - r.rrComputed) > 0.05)
    f.push(`R:R reported ${r.rrReported.toFixed(2)}, computes to ${r.rrComputed.toFixed(2)}`);
  if (r.posValue != null && r.posValue > state.capital)
    f.push(`Position ${rupee(r.posValue,0)} exceeds capital ${rupee(state.capital,0)}`);
  return f;
}

function finish(r){
  const risk = r.entryVal != null && r.stop != null ? Math.abs(r.entryVal - r.stop) : null;
  r.risk = risk;
  r.targets.forEach(t => {
    if (t.val == null || r.entryVal == null) return;
    const move = Math.abs(t.val - r.entryVal);
    t.profit = (move / r.entryVal) * 100;
    t.rr = risk ? move / risk : null;
  });
  r.rrComputed = r.targets[0] ? r.targets[0].rr : null;
  // Worst fill inside an entry zone: the top for a long, the bottom for a short.
  if (r.entryWorst != null && r.stop != null && r.targets[0] && r.targets[0].val != null){
    const w = Math.abs(r.entryWorst - r.stop);
    r.rrWorst = w ? Math.abs(r.targets[0].val - r.entryWorst) / w : null;
  }
  r.flags = Array.isArray(r.serverWarnings) ? r.serverWarnings : flagRow(r);
  return r;
}

function rowFromScan(s){
  const d = s.d;
  return finish({
    src:"scan", id:s.id, rank:s.rank, sym:s.sym, bias:s.bias, setupType:s.type,
    entryLabel:`${rupee(s.entry[0],0)}–${fmt(s.entry[1],0)}`,
    entryVal:d.entryMid,
    entryWorst:s.bias === "LONG" ? s.entry[1] : s.entry[0],
    conditions:s.conditions.map(c => ({ text:c.text, req:c.mandatory })),
    invalidation:s.invalidation,
    stop:s.stop,
    targets:s.targets.map((t,i) => ({ label:t.label, val:mid([t.lo,t.hi]),
      label2:t.lo === t.hi ? rupee(t.lo,0) : `${rupee(t.lo,0)}–${fmt(t.hi,0)}` })),
    score:d.computed, breakdownSum:d.computed, rrReported:null,
    posValue:null, tier:s.tier
  });
}

/* Maps one setup from the analysis response (framework shape). */
const CHECK_LABEL = {
  price_close_above: "price", price_close_below: "price",
  above_vwap: "vwap", below_vwap: "vwap",
  volume_expansion: "volume",
  index_above: "index", index_below: "index",
  sector_positive: "sector", sector_negative: "sector",
  manual: "manual"
};

function rowFromApi(s, i){
  const long = s.bias === "LONG";
  const conditions = (s.conditions || []).map(c => ({
    text: c.text,
    req: c.required !== false,
    kind: CHECK_LABEL[c.check && c.check.type] || "manual"
  }));

  return finish({
    src:"api", id:`api-${s.symbol}`, rank:i + 1, sym:s.symbol, bias:s.bias, setupType:s.setup,
    entryLabel:rupee(s.entryTrigger), entryVal:s.entryTrigger,
    conditions,
    invalidation:s.invalidation,
    stop:s.stopLoss,
    targets:(s.targets || []).map((v,ix) => ({ label:`T${ix+1}`, val:v, label2:rupee(v) })),
    score:s.score, breakdownSum:null,
    rrReported:null,
    rrStated:s.riskRewardStated,
    posValue:s.positionSizing ? s.positionSizing.positionValue : null,
    shares:s.positionSizing ? s.positionSizing.shares : null,
    tier:s.top3Rank ? `Top 3 · #${s.top3Rank}` : (s.inTop3 ? "Top 3" : null),
    serverWarnings:s.warnings || [],
    raw:s
  });
}

   PASTE BRIDGE — the framework prompt plus tonight's computed facts go to
   whichever assistant the user already pays for; the reply comes back here.
   The server merges and validates it exactly as it would an API response.

state.brief = { status:"idle", data:null, error:null, copied:false, submitting:false, universe:"fno" };

async function generateBrief(){
  state.brief.status = "loading"; state.brief.error = null; render();
  try {
    const data = await api("/api/v1/analyst/brief", {
      method:"POST",
      body:{ capital:state.capital, riskPercent:SCAN.risk.perTradePct, maxTrades:SCAN.risk.maxTrades,
             universe: state.brief.universe }
    });
    state.brief.data = data;
    state.brief.status = "ready";
    log("ok", "brief generated", {
      briefId: data.briefId, universe: data.universeCount, chars: data.pasteText.length
    });
  } catch (err){
    state.brief.status = "error";
    state.brief.error = err.message;
  }
  render();
}

async function submitAnalystResponse(text){
  state.brief.submitting = true; state.brief.error = null; render();
  try {
    const plan = await api("/api/v1/analyst/response", {
      method:"POST",
      body:{ briefId: state.brief.data ? state.brief.data.briefId : undefined, response: text }
    });
    applyPlan(plan);
    state.view = "all";
    await loadPlanHistory();
    log("ok", "pasted plan accepted", {
      setups: plan.setups.length,
      watchlist: (plan.watchlist || []).length,
      warnings: plan.setups.reduce((a, x) => a + (x.warnings || []).length, 0),
      noHighQualitySetup: plan.noHighQualitySetup
    });
  } catch (err){
    state.brief.error = err.message;
    state.brief.detail = err.detail || null;
    log("error", "pasted plan rejected", { error: err.message, detail: err.detail });
  }
  state.brief.submitting = false;
  render();
}

async function refreshFromApi(){
  const input = document.getElementById("api-url");
  if (input && input.value.trim()) state.apiBase = input.value.trim().replace(/\/+$/, "");
  try { localStorage.setItem("nw.apiBase", state.apiBase); } catch(e){}

  state.api.status = "loading"; state.api.error = null; render();

  try {
    const data = await api("/api/v1/intraday-analysis", {
      method:"POST",
      body:{ capital:state.capital, riskPercent:SCAN.risk.perTradePct, maxTrades:SCAN.risk.maxTrades }
    });
    if (!Array.isArray(data.setups)) throw new Error("Response carried no setups array.");

    state.api.rows = data.setups.map(rowFromApi);
    state.api.plan = data;
    state.api.meta = data.market || null;
    state.api.at = new Date();
    state.api.status = "ok";
    state.source = "api";

    log("ok", "scan loaded", {
      setups: data.setups.length,
      high: data.setups.filter(x => x.tier === "HIGH").length,
      noHighQualitySetup: data.noHighQualitySetup,
      analyst: data.analyst,
      skipped: (data.skipped || []).length,
      avoided: (data.stocksToAvoid || []).length,
      funnel: data.framework && data.framework.funnel
    });
    (data.dataNotes || []).forEach(nte => log("warn", "data note", nte));
  } catch (err){
    state.api.status = "error";
    state.api.error = err.message;
    state.api.code = err.code || null;
  }
  render();
}

    <span class="num">POST /api/v1/intraday-analysis</span>.`;
}

    </div>`;
  }).join("")}</div>`;
}

/* Vertical price ladder. Bands scale with the card; type stays at CSS sizes.
   Labels are decluttered downward so near-identical levels never overlap. */
function ladder(s){
  const d = s.d;
  const lo = Math.min(s.stop, s.facts.low ?? s.stop, s.facts.close) * 0.996;
  const hi = Math.max(...s.targets.map(t => t.hi)) * 1.004;
  const H = 306, pad = 13;
  const y = v => pad + (hi - v) / (hi - lo) * (H - pad * 2);
  const t1 = d.tgts[0], t2 = d.tgts[d.tgts.length - 1];

  const bands = [
    { cls:"risk", a:s.stop,     b:d.entryMid },
    { cls:"r1",   a:d.entryMid, b:t1.mid },
    { cls:"r2",   a:t1.mid,     b:t2.mid }
  ].map(b => `<div class="lad-band ${b.cls}" style="top:${y(Math.max(b.a,b.b)).toFixed(1)}px;
      height:${Math.abs(y(b.a) - y(b.b)).toFixed(1)}px"></div>`).join("");

  const entryBand = `<div class="lad-entry" style="top:${y(s.entry[1]).toFixed(1)}px;
      height:${Math.max(5, Math.abs(y(s.entry[0]) - y(s.entry[1]))).toFixed(1)}px"></div>`;

  const levels = [
    { role:"T2",      px:rupee(t2.mid,0),  note:`+${d.tgts[1].profitPct.toFixed(1)}%`, v:t2.mid,        tone:"acc" },
    { role:"T1",      px:rupee(t1.mid,0),  note:`+${d.tgts[0].profitPct.toFixed(1)}%`, v:t1.mid,        tone:"acc" },
    { role:"Entry",   px:`${rupee(s.entry[0],0)}–${fmt(s.entry[1],0)}`, note:"",       v:d.entryMid,    tone:"acc" },
    { role:"Trigger", px:rupee(s.keyLevel),note:"5-min close above",    v:s.keyLevel,  tone:"acc dash" },
    { role:"Close",   px:rupee(s.facts.close), note:s.facts.closeExact ? "" : "approx", v:s.facts.close, tone:"ink" },
    { role:"Stop",    px:rupee(s.stop,0),  note:`−${d.riskPct.toFixed(2)}%`,           v:s.stop,        tone:"bad" }
  ].map(l => ({ ...l, y: y(l.v) }));

  const MIN = 19;
  const ordered = [...levels].sort((a,b) => a.y - b.y);
  let prev = -Infinity;
  ordered.forEach(l => { l.ly = Math.max(l.y, prev + MIN); prev = l.ly; });
  const overflow = ordered[ordered.length - 1].ly - (H - 10);
  if (overflow > 0) ordered.forEach(l => { l.ly -= overflow; });

  const marks = ordered.map(l => `
    <div class="lad-tick ${l.tone}" style="top:${l.y.toFixed(1)}px"></div>
    <div class="lad-lab ${l.tone}" style="top:${l.ly.toFixed(1)}px">
      <span class="role">${esc(l.role)}</span>
      <span class="px">${l.px}</span>
      ${l.note ? `<span class="note">${esc(l.note)}</span>` : ""}
    </div>`).join("");

  return `<div class="ladder" role="img"
    aria-label="Price ladder for ${esc(s.sym)}: trigger ${s.keyLevel}, entry ${s.entry[0]} to ${s.entry[1]}, stop ${s.stop}, targets ${t1.mid} and ${t2.mid}">
    ${bands}${entryBand}${marks}
  </div>`;
}

function condList(s, evaluated){
  const rows = s.conditions.map(c => {
    let cls = "pend", mark = "○", mcls = "m-unk", chip = "";
    if (evaluated){
      const met = SIM[c.src];
      cls = met ? "met" : "unmet";
      mark = met ? "✓" : "✗";
      mcls = met ? "m-ok" : "m-no";
      chip = met ? `<span class="chip good">met</span>` : `<span class="chip ${c.mandatory?"bad":"unk"}">${c.mandatory?"not met":"absent"}</span>`;
    } else {
      chip = `<span class="chip unk">awaiting feed</span>`;
    }
    return `<div class="check ${cls}">
      <div class="check-mark ${mcls}" aria-hidden="true">${mark}</div>
      <div class="check-text">${esc(c.text)}
        <span class="why">${c.mandatory ? "Required" : "Preferred"}${c.why ? " · " + esc(c.why) : ""}</span></div>
      <div>${chip}</div>
    </div>`;
  }).join("");

  const man = s.conditions.filter(c => c.mandatory);
  const metMan = evaluated ? man.filter(c => SIM[c.src]).length : 0;
  const ready = evaluated && metMan === man.length;
  const tally = evaluated
    ? `<div class="tally">
         <span class="num">${metMan}/${man.length}</span>
         <span class="muted">required conditions met</span>
         <span style="margin-left:auto">${ready
            ? `<span class="chip good"><span class="glyph">✓</span> Entry valid</span>`
            : `<span class="chip bad"><span class="glyph">✗</span> No entry</span>`}</span>
       </div>`
    : `<div class="tally"><span class="muted">Conditions evaluate when an intraday feed supplies VWAP, 5-minute closes, per-bar volume and live index levels.</span></div>`;

  return `<div class="checks">${rows}</div>${tally}`;
}

function gapVerdict(s, g){
  for (const r of s.gapPlan) if (g >= r.lo && g <= r.hi) return r;
  return null;
}

function viewDesk(){
  const s = cur(), d = s.d;
  const nifty = SCAN.market.indices[0];
  const phase = state.phase;

  let phaseBlock = "";

  if (phase === "tonight"){
    phaseBlock = `
      <div class="section">
        <div class="section-head"><h2>Trade plan</h2><span class="eyebrow">${esc(s.sym)} · read tonight, act tomorrow</span></div>
        <div class="grid g2">
          <div class="card">
            <div class="card-head"><span class="card-title">Levels</span>
              <span class="chip ${s.bias==="LONG"?"good":"bad"}" style="margin-left:auto">${esc(s.bias)}</span></div>
            ${ladder(s)}
          </div>
          <div class="card">
            <div class="card-head"><span class="card-title">The numbers</span></div>
            <dl class="kv">
              <dt>Trigger (key level)</dt><dd>${rupee(s.keyLevel)}</dd>
              <dt>Entry zone</dt><dd>${rupee(s.entry[0],0)}–${fmt(s.entry[1],0)}</dd>
              <dt>Stop loss</dt><dd style="color:var(--bad)">${rupee(s.stop,0)}</dd>
              <dt>Risk per share</dt><dd>${rupee(d.risk,2)} · ${d.riskPct.toFixed(2)}%</dd>
              ${d.tgts.map(t => `<dt>${t.label} · ${t.rr.toFixed(2)}:1</dt>
                <dd style="color:var(--accent)">${rupee(t.mid,0)} &nbsp;+${t.profitPct.toFixed(2)}%</dd>`).join("")}
            </dl>
            <hr class="rule">
            <div class="eyebrow" style="margin-bottom:6px">Invalidation</div>
            <p class="muted">${esc(s.invalidation)}</p>
            <div class="eyebrow" style="margin:12px 0 6px">Stop rationale</div>
            <p class="muted">${esc(s.stopReason)}</p>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-head"><h2>Entry conditions</h2>
          <span class="eyebrow">${s.conditions.filter(c=>c.mandatory).length} required · ${s.conditions.filter(c=>!c.mandatory).length} preferred</span></div>
        <div class="card">${condList(s, false)}</div>
      </div>`;
  }

  if (phase === "preopen"){
    const v = gapVerdict(s, state.gap);
    const openPx = s.facts.close * (1 + state.gap/100);
    phaseBlock = `
      <div class="section">
        <div class="section-head"><h2>09:00–09:15 revalidation</h2>
          <span class="eyebrow">mechanical — from the scan's own gap table</span></div>
        <div class="card">
          <div class="grid g3" style="align-items:end;gap:16px">
            <div class="field">
              <label for="gap-in">Opening gap on ${esc(s.sym)}</label>
              <input class="input" id="gap-in" type="number" step="0.1" value="${state.gap}">
            </div>
            <div>
              <div class="eyebrow" style="margin-bottom:4px">Implied open</div>
              <div class="num" style="font-size:22px">${rupee(openPx)}</div>
            </div>
            <div>
              <div class="eyebrow" style="margin-bottom:4px">Against trigger ${rupee(s.keyLevel)}</div>
              <div class="num" style="font-size:22px;color:${openPx>=s.keyLevel?"var(--warn)":"var(--ink)"}">
                ${openPx>=s.keyLevel ? "opens above" : rupee(s.keyLevel-openPx,2)+" below"}</div>
            </div>
          </div>
          <hr class="rule">
          <div class="lights">
            ${["green","yellow","red"].map(k => `
              <div class="light ${k} ${v && v.verdict===k ? "on":""}">
                <div class="light-name">${k}</div>
                <div class="light-body">${esc(s.lights[k].slice(0,3).join(" · "))}</div>
              </div>`).join("")}
          </div>
          ${v ? `<div class="banner ${v.verdict==="green"?"good":v.verdict==="yellow"?"warn":"bad"}" style="margin-top:16px">
            <span class="glyph">${v.verdict==="green"?"✓":v.verdict==="yellow"?"!":"✗"}</span>
            <div><strong>${v.verdict.toUpperCase()}</strong> — ${esc(v.action)}</div></div>` : ""}
        </div>
      </div>

      <div class="section">
        <div class="section-head"><h2>Full gap table</h2></div>
        <div class="table-wrap"><table>
          <thead><tr><th>Opening gap</th><th>Verdict</th><th>Prescribed action</th></tr></thead>
          <tbody>${s.gapPlan.map(r => `<tr${v===r?' style="background:rgba(255,255,255,.04)"':''}>
            <td class="n">${r.lo<=-99?"below −1%":r.hi>=99?"above +3%":`${r.lo>0?"+":""}${r.lo}% to ${r.hi>0?"+":""}${r.hi}%`}</td>
            <td><span class="chip ${r.verdict==="green"?"good":r.verdict==="yellow"?"warn":"bad"}">${r.verdict}</span></td>
            <td class="muted" style="white-space:normal">${esc(r.action)}</td></tr>`).join("")}</tbody>
        </table></div>
      </div>`;
  }

  if (phase === "live"){
    phaseBlock = `
      <div class="section">
        <div class="section-head"><h2>Condition monitor</h2>
          <label class="switch" style="margin-left:auto">
            <input type="checkbox" id="sim" ${state.simulate?"checked":""}>
            <span class="track"></span> Demo: simulate a feed
          </label>
        </div>
        ${state.simulate
          ? `<div class="banner warn" style="margin-bottom:14px"><span class="glyph">!</span>
             <div>Simulated states, not market data. Shown so the monitor's behaviour is visible before a feed is attached.</div></div>`
          : `<div class="banner" style="margin-bottom:14px"><span class="glyph">○</span>
             <div>No intraday feed attached. This view needs VWAP, 5-minute closes, per-bar volume, the live Nifty level and live sector indices.</div></div>`}
        <div class="grid g2">
          ${SCAN.setups.map(x => `<div class="card${x.id===state.setupId?" lift":""}">
            <div class="card-head">
              <span class="card-title">${esc(x.sym)}</span>
              <span class="chip ${x.bias==="LONG"?"good":"bad"}">${esc(x.bias)}</span>
              <span class="chip unk" style="margin-left:auto">trigger ${rupee(x.keyLevel)}</span>
            </div>
            ${condList(x, state.simulate)}
          </div>`).join("")}
        </div>
      </div>

      <div class="section">
        <div class="section-head"><h2>Failed-breakout rule</h2></div>
        <div class="card"><p class="muted">${esc(SCAN.setups[0].failRule)}</p></div>
      </div>`;
  }

  if (phase === "close"){
    phaseBlock = `
      <div class="section">
        <div class="section-head"><h2>Outcome log</h2><span class="eyebrow">the loop that decides whether any of this works</span></div>
        <div class="banner" style="margin-bottom:14px"><span class="glyph">○</span>
          <div>Nothing logged yet. Each setup resolves at the close into one of: <strong>T2 hit · T1 hit · stopped · invalidated · expired unfilled</strong>. That record is what turns a score into a measured hit rate.</div></div>
        <div class="table-wrap"><table>
          <thead><tr><th>Setup</th><th>Bias</th><th>Score</th><th>Triggered</th><th>Outcome</th><th>R multiple</th><th>Prompt version</th></tr></thead>
          <tbody>${SCAN.setups.map(x => `<tr>
            <td><strong>${esc(x.sym)}</strong></td>
            <td><span class="chip ${x.bias==="LONG"?"good":"bad"}">${esc(x.bias)}</span></td>
            <td class="n">${x.d.computed}</td>
            <td class="dim">—</td><td class="dim">pending close</td><td class="dim">—</td>
            <td class="dim">—</td></tr>`).join("")}</tbody>
        </table></div>
        <div class="card" style="margin-top:16px">
          <h3>What this view will answer</h3>
          <ul class="list">
            <li>Do setups scoring 80+ actually outperform those in the 70s?</li>
            <li>Which of the nine factors predict follow-through, and which are noise?</li>
            <li>How often does a triggered setup reach T1 before the stop?</li>
            <li>How often does the scan produce nothing — and was that the right call?</li>
          </ul>
          <p class="dim" style="margin-top:10px">The scan states it has no validated historical edge and assigns no probability. Only this log can change that.</p>
        </div>
      </div>`;
  }

  return `
    <div class="page-head">
      <div>
        <h1>Desk</h1>
        <p class="sub">Scan for the ${esc(SCAN.meta.forSession)} session · generated ${esc(SCAN.meta.analysedAt)}</p>
      </div>
      <div class="head-right">
        <span class="chip warn"><span class="glyph">!</span> ${esc(SCAN.meta.confidence)} confidence</span>
      </div>
    </div>

    <div class="phases" role="group" aria-label="Session phase">
      ${PHASES.map(p => `<button class="phase" data-phase="${p.id}" aria-pressed="${state.phase===p.id}">${p.label}</button>`).join("")}
    </div>

    <div class="grid g2 section">
      <div class="card lift">
        <div class="card-head">
          <span class="card-title">Top setup · ${esc(s.sym)}</span>
          <span class="chip good" style="margin-left:auto">${esc(s.tier)}</span>
        </div>
        <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap">
          <div class="big">${d.computed}<span style="font-size:20px;color:var(--ink-3)">/100</span></div>
          <span class="chip good">${esc(s.bias)}</span>
          <span class="chip">${esc(s.type)}</span>
        </div>
        <p class="muted" style="margin-top:12px">${esc(s.why)}</p>
        <hr class="rule">
        <dl class="kv">
          <dt>Assessable score</dt><dd>${d.assessableGot}/${d.assessableMax} · ${d.assessablePct.toFixed(0)}%</dd>
          <dt>Points that could not be verified</dt><dd>${d.unknownPts}</dd>
        </dl>
        <p class="dim" style="margin-top:10px;font-size:12px">A quality score, not a probability of profit.</p>
      </div>

      <div class="card">
        <div class="card-head"><span class="card-title">Market regime</span>
          <span class="chip warn" style="margin-left:auto">range-bound</span></div>
        <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap">
          <div class="big">${fmt(nifty.close)}</div>
          <span class="chip good">${pct(nifty.changePct)}</span>
          <span class="chip">VIX ${fmt(SCAN.market.vix.value)}</span>
        </div>
        <p class="muted" style="margin-top:12px">${esc(SCAN.market.regime)}. ${esc(SCAN.market.regimeNote)}</p>
        <hr class="rule">
        <dl class="kv">
          <dt>Day's range</dt><dd>${fmt(nifty.low)} – ${fmt(nifty.high)}</dd>
          <dt>Immediate resistance</dt><dd>${esc(nifty.resistance[0])}</dd>
          <dt>Immediate support</dt><dd>${esc(nifty.support[0])}</dd>
        </dl>
      </div>
    </div>

    <div class="section">
      <div class="section-head"><h2>Watchlist</h2>
        <span class="eyebrow">1 tradeable · 1 watchlist · 1 extended · 1 rejected</span></div>
      <div class="table-wrap"><table>
        <thead><tr><th>#</th><th>Stock</th><th>Bias</th><th>Setup</th><th>Score</th><th>Quality</th><th>Trigger</th><th>R:R to T1</th><th>To T1</th><th>Main risk</th></tr></thead>
        <tbody>${SCAN.setups.map(setupRow).join("")}</tbody>
      </table></div>
      <p class="dim" style="margin-top:10px;font-size:12px">
        ${esc(SCAN.watchOnly[0].sym)} scores ${SCAN.watchOnly[0].score} but is watchlist-only on extension.
        ${esc(SCAN.rejected[0].sym)} was rejected outright. Both are on the Rejected page with reasons.</p>
    </div>

    ${phaseBlock}`;
}

function viewSetups(){
  const s = cur(), d = s.d;
  return `
    <div class="page-head">
      <div>
        <h1>${esc(s.sym)}</h1>
        <p class="sub">${esc(s.name)} · ${esc(s.type)} · ${esc(s.sector)} sector</p>
      </div>
      <div class="head-right">
        ${SCAN.setups.map(x => `<button class="phase" data-setup="${x.id}" aria-pressed="${x.id===s.id}"
          style="border:1px solid var(--line);border-radius:10px">${esc(x.sym)}</button>`).join("")}
      </div>
    </div>

    <div class="grid g2">
      <div class="card">
        <div class="card-head"><span class="card-title">Score breakdown</span>
          <span class="num" style="margin-left:auto;font-size:20px">${d.computed}<span class="dim">/100</span></span></div>
        ${scoreBars(s)}
        <hr class="rule">
        ${d.mismatch ? `<div class="banner warn" style="margin-bottom:12px"><span class="glyph">!</span>
          <div><strong>Arithmetic flag.</strong> The nine factors sum to <span class="num">${d.computed}</span>,
          but the scan reports <span class="num">${s.reportedScore}</span>. The computed figure is shown throughout.</div></div>` : ""}
        <dl class="kv">
          <dt>Verified factors</dt><dd>${d.assessableGot}/${d.assessableMax} · ${d.assessablePct.toFixed(0)}%</dd>
          <dt>Unverifiable points</dt><dd>${d.unknownPts} of 100</dd>
        </dl>
        <p class="dim" style="margin-top:10px;font-size:12px">
          Hatched bars are factors the scan could not verify. Unknown is not the same as weak —
          those ${d.unknownPts} points are why nothing reached 90 tonight.</p>
      </div>

      <div class="card">
        <div class="card-head"><span class="card-title">Levels</span>
          <span class="chip ${s.bias==="LONG"?"good":"bad"}" style="margin-left:auto">${esc(s.bias)}</span></div>
        ${ladder(s)}
        <hr class="rule">
        <dl class="kv">
          <dt>Risk per share</dt><dd>${rupee(d.risk,2)}</dd>
          ${d.tgts.map(t => `<dt>${t.label} reward · R:R</dt>
            <dd>${rupee(t.reward,2)} · ${t.rr.toFixed(2)}:1</dd>`).join("")}
        </dl>
      </div>
    </div>

    <div class="section">
      <div class="section-head"><h2>Entry conditions</h2></div>
      <div class="card">
        <div class="banner good" style="margin-bottom:14px"><span class="glyph">▸</span>
          <div><strong>${esc(s.keyLevelNote)}</strong> A move through ${rupee(s.keyLevel)} without volume is not sufficient.</div></div>
        ${condList(s, false)}
      </div>
    </div>

    <div class="grid g2 section">
      <div class="card">
        <div class="card-head"><span class="card-title">Session facts</span></div>
        <dl class="kv">
          <dt>Close${s.facts.closeExact?"":" <span class='chip unk'>approx</span>"}</dt><dd>${rupee(s.facts.close)}</dd>
          <dt>High</dt><dd>${rupee(s.facts.high)}</dd>
          ${s.facts.low ? `<dt>Low</dt><dd>${rupee(s.facts.low)}</dd>` : ""}
          <dt>Volume</dt><dd>${esc(s.facts.volume)}</dd>
          <dt>20-day average</dt><dd>${esc(s.facts.avgVolume)}</dd>
          ${s.facts.volRatio ? `<dt>Volume ratio</dt><dd>${s.facts.volRatio}×</dd>` : ""}
          ${s.facts.atr ? `<dt>ATR(14)</dt><dd>${rupee(s.facts.atr)} · ${s.facts.atrPct}%</dd>` : ""}
          ${s.facts.delivery ? `<dt>Delivery</dt><dd>${s.facts.delivery}% vs ${s.facts.deliveryAvg}% avg</dd>` : ""}
          ${s.facts.week52High ? `<dt>52-week high</dt><dd>${rupee(s.facts.week52High)}</dd>` : ""}
        </dl>
      </div>

      <div class="card">
        <div class="card-head"><span class="card-title">Multi-timeframe</span></div>
        <dl class="kv">${s.mtf.map(([tf,txt,ok]) => `
          <dt>${esc(tf)}</dt>
          <dd>${ok===false ? `<span class="chip unk">${esc(txt)}</span>` : `<span class="muted">${esc(txt)}</span>`}</dd>`).join("")}
        </dl>
        <hr class="rule">
        <div class="eyebrow" style="margin-bottom:6px">Catalyst</div>
        <p class="muted">${s.catalyst.verified
          ? `<span class="chip good">verified</span> ${esc(s.catalyst.text)}`
          : `<span class="chip unk">unverified</span> ${esc(s.catalyst.text)}`}</p>
      </div>
    </div>

    <div class="section">
      <div class="section-head"><h2>Self-critique</h2><span class="eyebrow">the scan arguing against itself</span></div>
      <div class="card">
        <dl class="kv">${s.critique.map(([k,v]) => `<dt>${esc(k)}</dt><dd style="text-align:right;max-width:52ch;font-family:var(--ui);color:var(--ink-2)">${esc(v)}</dd>`).join("")}</dl>
      </div>
    </div>`;
}

function viewMarket(){
  const m = SCAN.market;
  const maxAbs = 1.3;
  const sectRow = (name, pctv, exact, weakNote) => {
    const w = Math.min(Math.abs(pctv ?? 1) / maxAbs, 1) * 50;
    const cls = weakNote ? "unq" : (pctv > 0 ? "pos" : "neg");
    return `<div class="sect-row">
      <div class="bar-name"><span>${esc(name)}</span></div>
      <div class="sect-axis"><div class="sect-zero"></div><div class="sect-bar ${cls}" style="width:${w.toFixed(1)}%"></div></div>
      <div class="bar-val">${weakNote ? `<span class="dim">n/a</span>` : (exact?"":"~") + pct(pctv)}</div>
    </div>`;
  };

  return `
    <div class="page-head">
      <div><h1>Market</h1><p class="sub">Session of ${esc(SCAN.meta.lastSession)}</p></div>
      <div class="head-right"><span class="chip warn">${esc(m.regime)}</span></div>
    </div>

    <div class="grid g2">
      ${m.indices.map(i => `<div class="card">
        <div class="card-head"><span class="card-title">${esc(i.name)}</span>
          <span class="chip ${i.changePct>=0?"good":"bad"}" style="margin-left:auto">${pct(i.changePct)}</span></div>
        <div class="big">${fmt(i.close)}</div>
        <hr class="rule">
        <dl class="kv">
          <dt>Previous close</dt><dd>${fmt(i.prevClose)}</dd>
          <dt>Open${i.gapPct!=null?` <span class="dim">(gap ${pct(i.gapPct)})</span>`:""}</dt><dd>${fmt(i.open)}</dd>
          <dt>High</dt><dd>${fmt(i.high)}</dd>
          <dt>Low</dt><dd>${fmt(i.low)}</dd>
          ${i.advDec?`<dt>Advance / decline</dt><dd>${esc(i.advDec)}</dd>`:""}
          <dt>Support</dt><dd>${i.support.join(" / ")}</dd>
          <dt>Resistance</dt><dd>${i.resistance.join(" / ")}</dd>
        </dl>
        ${i.candle?`<p class="dim" style="margin-top:10px;font-size:12px">${esc(i.candle)}</p>`:""}
      </div>`).join("")}
    </div>

    <div class="grid g2 section">
      <div class="card">
        <div class="card-head"><span class="card-title">Sector rotation</span>
          <span class="eyebrow" style="margin-left:auto">% on the session</span></div>
        <div class="sect">
          ${m.indices && SCAN.sectors.strong.map(s => sectRow(s.name, s.pct, s.exact, false)).join("")}
          ${SCAN.sectors.weak.map(s => sectRow(s.name, -1, true, s.note)).join("")}
        </div>
        <hr class="rule">
        <p class="dim" style="font-size:12px">
          Hatched bars are sectors the scan describes only as negative, with no figure —
          shown as direction without magnitude rather than given an invented number.</p>
        <p class="muted" style="margin-top:8px">${esc(SCAN.sectors.observation)}</p>
      </div>

      <div class="card">
        <div class="card-head"><span class="card-title">India VIX</span></div>
        <div style="display:flex;align-items:baseline;gap:12px">
          <div class="big">${fmt(m.vix.value)}</div>
          <span class="chip good">${pct(m.vix.changePct)}</span>
        </div>
        <p class="muted" style="margin-top:12px">${esc(m.vix.read)}</p>
        <hr class="rule">
        <div class="eyebrow" style="margin-bottom:8px">F&amp;O movers</div>
        <dl class="kv">${SCAN.movers.map(x => `
          <dt>${esc(x.sym)}</dt>
          <dd style="color:${x.pct>0?"var(--accent)":"var(--bad)"}">${x.exact?"":"~"}${pct(x.pct)}</dd>`).join("")}</dl>
        <p class="dim" style="margin-top:10px;font-size:12px">Selecting the biggest movers alone would violate the methodology — these are inputs, not candidates.</p>
      </div>
    </div>

    <div class="section">
      <div class="section-head"><h2>Regime call</h2></div>
      <div class="grid g2">
        <div class="card">
          <div class="fip">${m.fip.map(f => `<div class="${f.cls}">
            <span class="lab">${esc(f.lab)}</span>${esc(f.text)}</div>`).join("")}</div>
        </div>
        <div class="card">
          <h3>Strategy implication</h3>
          <ul class="list">${m.strategy.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
        </div>
      </div>
    </div>`;
}

function viewRejected(){
  const w = SCAN.watchOnly[0], r = SCAN.rejected[0];
  return `
    <div class="page-head">
      <div><h1>Rejected</h1><p class="sub">What the filter threw out, and why — the record that shows the filter is working</p></div>
    </div>

    <div class="grid g2">
      <div class="card">
        <div class="card-head"><span class="card-title">${esc(w.sym)}</span>
          <span class="chip warn" style="margin-left:auto">${esc(w.tier)}</span></div>
        <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap">
          <div class="big">${w.score}<span style="font-size:20px;color:var(--ink-3)">/100</span></div>
          <span class="chip good">${esc(w.bias)}</span>
        </div>
        <p class="muted" style="margin-top:12px">${esc(w.note)}</p>
        <hr class="rule">
        <dl class="kv">
          <dt>Trigger</dt><dd>${esc(w.keyLevel)}</dd>
          <dt>Entry</dt><dd>${esc(w.entry)}</dd>
          <dt>Stop</dt><dd>${esc(w.stop)}</dd>
          <dt>Targets</dt><dd>${esc(w.targets)}</dd>
        </dl>
        <div class="banner good" style="margin-top:14px"><span class="glyph">✓</span>
          <div><strong>Catalyst verified.</strong> ${esc(w.catalyst.text)}</div></div>
      </div>

      <div class="card">
        <div class="card-head"><span class="card-title">${esc(r.sym)}</span>
          <span class="chip bad" style="margin-left:auto">${esc(r.verdict)}</span></div>
        <span class="chip bad">${esc(r.bias)}</span>
        <p class="muted" style="margin-top:12px">${esc(r.detail)}</p>
        <div class="banner bad" style="margin:14px 0"><span class="glyph">✗</span><div>${esc(r.reason)}</div></div>
        <div class="eyebrow" style="margin-bottom:6px">Conditional re-entry</div>
        <p class="muted">${esc(r.conditional)}</p>
      </div>
    </div>

    <div class="section">
      <div class="section-head"><h2>Do not trade tomorrow</h2><span class="eyebrow">${SCAN.avoid.length} names</span></div>
      <div class="table-wrap"><table style="min-width:520px">
        <thead><tr><th>Stock</th><th>Reason</th></tr></thead>

    <div class="page-head">

          <dt>Position value</dt><dd>${rupee(posValue,0)}</dd>

          <dt>Maximum daily loss</dt><dd>${R.maxDailyLossPct}%</dd>
          <dt>Maximum consecutive losses</dt><dd>${R.maxConsecutiveLosses}</dd>
          <dt>Maximum simultaneous positions</dt><dd>${esc(R.maxPositions)}</dd>
          <dt>Maximum trades</dt><dd>${R.maxTrades}</dd>

        <hr class="rule">

        does not cleanly break ${rupee(SCAN.setups[0].keyLevel)} with confirmation, there is no
        ${esc(SCAN.setups[0].sym)} trade. If it breaks the level but gaps far beyond the planned entry —
        no trade, chase risk.</p>
      </div>
    </div>`;
}

       body:`The nine weighted factors sum to ${s.d.computed}, but the scan reports ${s.reportedScore}. Caught automatically at load — the app uses the computed figure.` }));
  const all = [...flags, ...SCAN.health];

  return `
    <div class="page-head">
      <div><h1>Data health</h1><p class="sub">What this scan knows, and what it only appears to know</p></div>
      <div class="head-right"><span class="chip warn"><span class="glyph">!</span> ${all.length} open flags</span></div>

    <div class="banner warn" style="margin-bottom:18px">

    <div class="grid g2">
      ${all.map(h => `<div class="card">
        <div class="card-head">
          <span class="chip ${h.level==="bad"?"bad":"warn"}"><span class="glyph">${h.level==="bad"?"✗":"!"}</span>${h.level==="bad"?"blocking":"degraded"}</span>

          <li><strong>VWAP</strong> — named in every setup's conditions</li>

function applyPlan(plan){
  state.api.rows = (plan.setups || []).map(rowFromApi);
  state.api.plan = plan;
  state.api.meta = plan.market || null;
  state.api.at = new Date(plan.acceptedAt || Date.now());
  state.api.status = "ok";
  state.source = "api";
  state.openSetup = null; state.openWatch = null;
}

async function loadPlanHistory(){
  try { state.history = await api("/api/v1/analyst/plans"); }
  catch (err){ log("warn", "could not load plan history", { error: err.message }); }
}

async function openPastPlan(briefId){
  if (!briefId || (state.api.plan && state.api.plan.briefId === briefId)) return;
  state.historyLoading = briefId; render();
  try { applyPlan(await api(`/api/v1/analyst/plans/${encodeURIComponent(briefId)}`)); }
  catch (err){ log("error", "could not open past plan", { briefId, error: err.message }); }
  state.historyLoading = null; render();
}

function historyBar(){
  const list = state.history || [];
  if (list.length < 2) return "";
  const active = state.api.plan && state.api.plan.briefId;
  const when = iso => new Date(iso).toLocaleString("en-IN", { day:"numeric", month:"short", hour:"2-digit", minute:"2-digit", hour12:false });
  const TABS = 6;
  const tab = (h, i) => `<button class="hist-tab" data-hist="${esc(h.briefId)}" aria-pressed="${h.briefId===active}"
      title="Brief ${esc(h.briefId)} · ${h.universeSize} stocks · top 3: ${esc((h.top3||[]).join(", ") || "none")}">
      <span>${i === 0 ? "Latest" : esc(when(h.acceptedAt))}</span>
      <span class="hist-meta">${i === 0 ? esc(when(h.acceptedAt)) + " · " : ""}${h.setups} setup${h.setups===1?"":"s"}${h.universeSize > 100 ? " · +non-F&O" : ""}</span>
      ${state.historyLoading === h.briefId ? `<span class="spin"></span>` : ""}
    </button>`;
  const older = list.slice(TABS);
  return `<div class="hist-bar" role="tablist" aria-label="Past analyses">
    ${list.slice(0, TABS).map(tab).join("")}
    ${older.length ? `<select class="input hist-older" id="hist-older" aria-label="Older analyses">
      <option value="">Older (${older.length})…</option>
      ${older.map(h => `<option value="${esc(h.briefId)}" ${h.briefId===active?"selected":""}>${esc(when(h.acceptedAt))} · ${h.setups} setups</option>`).join("")}
    </select>` : ""}
  </div>`;
}

function movePct(from, to){ return from ? ((to - from) / from) * 100 : null; }
const signPct = v => v == null ? "" : `${v > 0 ? "+" : ""}${v.toFixed(2)}%`;

  const flagged = rows.filter(r => r.flags.length).length;
  const loading = api.status === "loading";

const VIEWS = { desk:viewDesk, all:viewAll, analyst:viewAnalyst, setups:viewSetups, market:viewMarket, rejected:viewRejected, risk:viewRisk, health:viewHealth, connect:viewConnect, logs:viewLogs };

/* ========================= render + events ========================= */
function render(){
  document.getElementById("main").innerHTML = VIEWS[state.view]();
  const nAn = document.getElementById("nc-analyst");
  if (nAn) nAn.textContent = state.brief.data ? String(state.brief.data.universeCount) : "—";
  const nAll = document.getElementById("nc-all");
  if (nAll) nAll.textContent = state.source === "api" ? state.api.rows.length : SCAN.setups.length;
  document.querySelectorAll(".nav-item").forEach(b => {
    if (b.dataset.view === state.view) b.setAttribute("aria-current","page");
    else b.removeAttribute("aria-current");
  });
  window.scrollTo({ top:0 });
}

document.addEventListener("click", e => {
  const hist = e.target.closest("[data-hist]");
  if (hist){ e.preventDefault(); openPastPlan(hist.dataset.hist); return; }
  const setupRow = e.target.closest("tr[data-setup]");
  if (setupRow){
    const sym = setupRow.dataset.setup;
    state.openSetup = state.openSetup === sym ? null : sym;
    render(); return;
  }
  const watchRow = e.target.closest("tr[data-watch]");
  if (watchRow){
    const sym = watchRow.dataset.watch;
    state.openWatch = state.openWatch === sym ? null : sym;
    render(); return;
  }
  const nav = e.target.closest(".nav-item");
  if (nav){ state.view = nav.dataset.view; render(); return; }

  const ph = e.target.closest("[data-phase]");
  if (ph){ state.phase = ph.dataset.phase; render(); return; }

  if (e.target.closest("#refresh")){ refreshFromApi(); return; }
  if (e.target.closest("#brief-gen")){ generateBrief(); return; }
  const un = e.target.closest("[data-univ]");
  if (un){ state.brief.universe = un.dataset.univ; render(); return; }
  if (e.target.closest("#brief-copy")){
    const msg = document.getElementById("brief-msg");
    navigator.clipboard.writeText(state.brief.data.pasteText)
      .then(() => { state.brief.copied = true; render(); })
      .catch(err => { if (msg) msg.textContent = `Copy failed: ${err.message}`; });
    return;
  }
  if (e.target.closest("#brief-save")){
    const blob = new Blob([state.brief.data.pasteText], { type:"text/plain" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `nightwatch-brief-${state.brief.data.briefId}.txt`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    state.brief.copied = true; render();
    return;
  }
  if (e.target.closest("#brief-submit")){
    const ta = document.getElementById("brief-reply");
    if (ta && ta.value.trim()) submitAnalystResponse(ta.value);
    return;
  }
  if (e.target.closest("#auth-login")){ loginWithDhan(); return; }
  if (e.target.closest("#auth-check")){ refreshAuthStatus().then(render); return; }
  if (e.target.closest("#auth-out")){ disconnect(); return; }
  if (e.target.closest("#auth-token")){
    const id = document.getElementById("tok-client");
    const tok = document.getElementById("tok-value");
    if (id && tok) loginWithToken(tok.value.trim(), id.value.trim());
    return;
  }

  const lf = e.target.closest("[data-logf]");
  if (lf){ state.logFilter = lf.dataset.logf; render(); return; }

  if (e.target.closest("#log-copy")){
    const msg = document.getElementById("log-msg");
    navigator.clipboard.writeText(LOG.asText())
      .then(() => { if (msg) msg.textContent = `Copied ${LOG.entries.length} entries.`; })
      .catch(err => { if (msg) msg.textContent = `Copy failed: ${err.message}`; });
    return;
  }
  if (e.target.closest("#log-save")){
    const blob = new Blob([LOG.asText()], { type:"text/plain" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `nightwatch-log-${new Date().toISOString().replace(/[:.]/g,"-")}.txt`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    return;
  }
  if (e.target.closest("#log-clear")){ LOG.clear(); render(); return; }

  const sr = e.target.closest("[data-src]");
  if (sr){ state.source = sr.dataset.src; render(); return; }

  const su = e.target.closest("[data-setup]");
  if (su){
    state.setupId = su.dataset.setup;
    if (state.view === "desk" && state.phase !== "live") state.view = "setups";
    render(); return;
  }
});

document.addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " "){
    const row = e.target.closest("tr[data-setup]");
    if (row){ e.preventDefault(); state.setupId = row.dataset.setup; state.view = "setups"; render(); }
  }
});

document.addEventListener("input", e => {
  if (e.target.id === "gap-in"){
    state.gap = parseFloat(e.target.value) || 0;
    render();
    const el = document.getElementById("gap-in");
    if (el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }
  if (e.target.id === "cap"){
    state.capital = Math.max(0, parseFloat(e.target.value) || 0);
    try { localStorage.setItem("nw.capital", state.capital); } catch(err){}
    const v = e.target.value;
    render();
    const el = document.getElementById("cap");
    if (el){ el.value = v; el.focus(); }
  }
});

document.addEventListener("change", e => {
  if (e.target.id === "sim"){ state.simulate = e.target.checked; render(); }

  if (e.target.id === "hist-older"){ openPastPlan(e.target.value); return; }
  if (e.target.id === "brief-file"){
    const file = e.target.files && e.target.files[0];
    e.target.value = ""; // so choosing the same file again still fires
    if (!file) return;
    const msg = document.getElementById("brief-file-msg");
    log("info", "reading analyst file", { name: file.name, bytes: file.size });
    file.text()
      .then(text => {
        const ta = document.getElementById("brief-reply");
        if (ta) ta.value = text;
        if (msg) msg.textContent = `${file.name} loaded (${(file.size/1024).toFixed(1)} kB) — submitting…`;
        submitAnalystResponse(text);
      })
      .catch(err => {
        if (msg) msg.textContent = `Could not read that file: ${err.message}`;
        log("error", "analyst file unreadable", { error: err.message });
      });
    return;
  }
  if (e.target.id === "api-url"){
    state.apiBase = e.target.value.trim().replace(/\/+$/, "") || state.apiBase;
    try { localStorage.setItem("nw.apiBase", state.apiBase); } catch(err){}
  }
});

document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "api-url"){ e.preventDefault(); refreshFromApi(); }
});

log("info", "dashboard started", { apiBase: state.apiBase, hasSession: Boolean(state.session), origin: location.origin });
refreshAuthStatus().then(async () => {
  if (state.view === "connect") render();
  if (state.auth.status !== "connected" || state.api.plan) return;
  try {
    const [plan] = await Promise.all([api("/api/v1/analyst/latest"), loadPlanHistory()]);
    if (plan && Array.isArray(plan.setups)){ applyPlan(plan); render(); }
  } catch (err){ log("warn", "could not restore latest plan", { error: err.message }); }
});

document.getElementById("nc-setups").textContent = SCAN.setups.length;
document.getElementById("nc-all").textContent = SCAN.setups.length;
document.getElementById("nc-rej").textContent = SCAN.avoid.length;
document.getElementById("nc-health").textContent = SCAN.health.length + SCAN.setups.filter(s => s.d.mismatch).length;
render();
</script>

</body>
</html>
